<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Login</title>

    <style>
        body{
        margin:0;
        font-family:Arial;
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        }

        .box{
        background:white;
        padding:40px;
        width:400px;
        border-radius:15px;
        box-shadow:0 5px 15px rgba(0,0,0,0.15);
        text-align:center;
        }

        h2{
        margin-bottom:25px;
        }

        a{
        display:block;
        text-decoration:none;
        padding:14px;
        margin-top:15px;
        border-radius:8px;
        color:white;
        font-size:18px;
        }

        .user{
        background:#28a745;
        }

        .admin{
        background:#dc3545;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Select Login Type</h2>

    <a href="/user-login" class="user">
        User Login
    </a>

    <a href="/admin-login" class="admin">
        Admin Login
    </a>

</div>

</body>
</html>
