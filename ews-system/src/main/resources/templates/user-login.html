<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <style>
        body{
        margin:0;
        font-family:Arial;
        background:#e8f5e9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        }

        .box{
        background:white;
        padding:40px;
        width:380px;
        border-radius:15px;
        box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }

        h2{
        text-align:center;
        color:#28a745;
        margin-bottom:20px;
        }

        input{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:8px;
        }

        button{
        width:100%;
        padding:12px;
        background:#28a745;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        margin-top: 10px;
        cursor: pointer;
        }
        .links{
            text-align: center;
            margin-top: 10px;
        }
        .links{
            margin: 0 15px;
            font-size: 16px;


        }
    </style>
</head>

<body>

<div class="box">

    <h2>User Login</h2>

    <form action="/userlogins" method="post">
        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
        <div class="links">
            <a href="/register">Create New Account</a>
        </div>


    </form>

    <p th:utext="${error}"
       style="color:red"></p>

</div>

</body>
</html>
